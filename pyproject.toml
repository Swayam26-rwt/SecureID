[project]
name = "secureid"
version = "3.0.0"
description = "SecureID — ISO/IEC 30107-3 compliant offline biometric decision platform with Platt calibration, Mahalanobis multi-template matching, Bayesian EER, adaptive EMA weight fusion, and SHA-256 audit chain."
requires-python = ">=3.9"
readme = "README.md"
authors = [{ name = "Swayam Rawat", email = "swaymrawat862@gmail.com" }]
keywords = [
    "biometrics", "facial-recognition", "liveness-detection", "presentation-attack-detection",
    "iso-30107", "nist-800-76", "fido2", "pad", "brt", "eer", "roc", "platt-calibration",
    "isotonic-regression", "mahalanobis", "score-fusion", "edge-computing",
    "computer-vision", "machine-learning", "secureid", "air-gapped", "zero-dependency"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.scripts]
secureid = "biometric_engine.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/Swayam26-rwt/SecureID"
Repository = "https://github.com/Swayam26-rwt/SecureID.git"
Documentation = "https://github.com/Swayam26-rwt/SecureID#readme"
Changelog = "https://github.com/Swayam26-rwt/SecureID/blob/main/CHANGELOG.md"
Issues = "https://github.com/Swayam26-rwt/SecureID/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["biometric_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
